name: Release audit
description: Set up pnpm and gitleaks, then run make release-audit.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        base="gitleaks_${GITLEAKS_VERSION}"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        tmp="$(mktemp -d)"
        curl -fsSL "$url/${base}_linux_x64.tar.gz" -o "$tmp/${base}_linux_x64.tar.gz"
        curl -fsSL "$url/${base}_checksums.txt" -o "$tmp/checksums.txt"
        ( cd "$tmp" && grep "${base}_linux_x64.tar.gz" checksums.txt | sha256sum -c - )
        mkdir -p "$RUNNER_TEMP/bin"
        tar -xzf "$tmp/${base}_linux_x64.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: Release audit
      shell: bash
      run: make release-audit
